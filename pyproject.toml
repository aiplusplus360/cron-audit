[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cron-audit"
version = "1.0.0"
description = "Audit crontabs: overlapping jobs, missed runs, silent schedule drift."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "aiplusplus360" }]
keywords = ["cron", "crontab", "scheduling", "monitoring", "drift", "devops", "sre"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
cron-audit = "cronaudit.cli:main"

[project.urls]
Homepage = "https://github.com/aiplusplus360/cron-audit"
Source = "https://github.com/aiplusplus360/cron-audit"
Issues = "https://github.com/aiplusplus360/cron-audit/issues"

[tool.setuptools]
packages = ["cronaudit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
